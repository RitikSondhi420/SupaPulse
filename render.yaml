services:
  # 1. NestJS GraphQL Backend
  - type: web
    name: supapulse-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://supapulse.netlify.app

  # 2. React Vite Frontend
  - type: web
    name: supapulse-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GRAPHQL_ENDPOINT
        fromService:
          type: web
          name: supapulse-backend
          property: host
